<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Counting Report</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f4; color: #292524; height: 100vh; display: flex; flex-direction: column; }

  .trigger-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .trigger-screen h1 { font-size: 20px; font-weight: 700; }
  .trigger-screen p { font-size: 13px; color: #78716c; max-width: 400px; text-align: center; line-height: 1.6; }
  .trigger-btn {
    padding: 12px 32px; background: #7c3aed; color: white; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .trigger-btn:hover { background: #6d28d9; transform: translateY(-1px); }
  .trigger-btn:active { transform: translateY(0); }
  .trigger-btn:disabled { background: #a8a29e; cursor: not-allowed; transform: none; }

  /* Running state */
  .running-screen { flex: 1; display: none; flex-direction: column; }
  .running-screen.active { display: flex; }
  .trigger-screen.hidden { display: none; }

  .status-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 20px;
    background: #fff; border-bottom: 1px solid #e7e5e4; font-size: 13px;
  }
  .status-bar .spinner { width: 16px; height: 16px; border: 2px solid #e7e5e4; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar .status-text { color: #57534e; font-weight: 500; }
  .status-bar .elapsed { margin-left: auto; color: #a8a29e; font-size: 11px; }

  .terminal-output {
    flex: 1; overflow-y: auto; padding: 16px 20px; background: #1c1917; color: #d6d3d1;
    font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  .terminal-output .error { color: #fca5a5; }
  .terminal-output .success { color: #86efac; }

  .error-screen {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px;
  }
  .error-screen.active { display: flex; }
  .error-screen h2 { color: #dc2626; font-size: 18px; }
  .error-screen p { color: #78716c; font-size: 13px; text-align: center; max-width: 500px; }
  .error-screen pre { background: #1c1917; color: #d6d3d1; padding: 16px; border-radius: 8px; font-size: 11px; max-width: 600px; max-height: 200px; overflow: auto; }
  .retry-btn {
    padding: 10px 24px; background: #7c3aed; color: white; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<!-- Trigger Screen -->
<div class="trigger-screen" id="triggerScreen">
  <span style="font-size: 48px;">📊</span>
  <h1>Skill Counting Report</h1>
  <p>點擊下方按鈕，AI 會即時計算目前所有 Skills 和 Apps 的最新統計數據，並生成圖表報告。</p>
  <button class="trigger-btn" id="startBtn" onclick="startAI()">🚀 開始計算</button>
</div>

<!-- Running Screen -->
<div class="running-screen" id="runningScreen">
  <div class="status-bar">
    <div class="spinner" id="spinner"></div>
    <span class="status-text" id="statusText">AI 正在計算中...</span>
    <span class="elapsed" id="elapsed">0s</span>
  </div>
  <div class="terminal-output" id="terminalOutput"></div>
</div>

<!-- Error Screen -->
<div class="error-screen" id="errorScreen">
  <span style="font-size: 48px;">⚠️</span>
  <h2>計算失敗</h2>
  <p id="errorMsg"></p>
  <pre id="errorDetail"></pre>
  <button class="retry-btn" onclick="resetToStart()">🔄 重新開始</button>
</div>

<script>
const API = window.location.port === '4097' ? '' : (window.location.protocol + '//' + window.location.hostname + ':4097');

let timerInterval = null;
let startTime = null;

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('elapsed').textContent = s + 's';
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

async function startAI() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('triggerScreen').classList.add('hidden');
  document.getElementById('runningScreen').classList.add('active');
  document.getElementById('errorScreen').classList.remove('active');

  const termOutput = document.getElementById('terminalOutput');
  termOutput.innerHTML = '';
  startTimer();

  try {
    const resp = await fetch(API + '/api/app-run/skill-counting-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cli: 'qwen' }),
    });

    if (!resp.ok) {
      throw new Error('API 回應錯誤: ' + resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let doneReceived = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const msg = JSON.parse(line);

          if (msg.type === 'status') {
            document.getElementById('statusText').textContent = msg.data.message;
            termOutput.innerHTML += `<span class="success">▸ ${escapeHtml(msg.data.message)}</span>\n`;
          }
          else if (msg.type === 'stdout') {
            const text = msg.data;
            if (text.trim()) {
              termOutput.innerHTML += escapeHtml(text);
            }
          }
          else if (msg.type === 'done') {
            doneReceived = true;
            stopTimer();
            document.getElementById('statusText').textContent = '✅ 計算完成！載入報告中...';
            termOutput.innerHTML += `\n<span class="success">▸ AI 計算完成！正在載入報告...</span>\n`;
            termOutput.scrollTop = termOutput.scrollHeight;

            // Wait a moment then load the generated report
            setTimeout(() => {
              window.location.href = API + '/api/app/skill-counting-report';
            }, 1500);
          }
          else if (msg.type === 'error') {
            throw new Error(msg.data.message);
          }
        } catch (e) {
          if (e.message && !e.message.includes('JSON')) throw e;
        }
      }
    }

    if (!doneReceived) {
      throw new Error('AI 回應結束但沒有生成有效報告');
    }

  } catch (err) {
    stopTimer();
    document.getElementById('runningScreen').classList.remove('active');
    document.getElementById('errorScreen').classList.add('active');
    document.getElementById('errorMsg').textContent = err.message;
    document.getElementById('errorDetail').textContent = termOutput.textContent.slice(-1000);
  }
}

function resetToStart() {
  document.getElementById('triggerScreen').classList.remove('hidden');
  document.getElementById('runningScreen').classList.remove('active');
  document.getElementById('errorScreen').classList.remove('active');
  document.getElementById('startBtn').disabled = false;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
