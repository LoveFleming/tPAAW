<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Counting Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --stone-50: #fafaf9; --stone-100: #f5f5f4; --stone-200: #e7e5e4;
    --stone-300: #d6d3d1; --stone-400: #a8a29e; --stone-500: #78716c;
    --stone-600: #57534e; --stone-700: #44403c; --stone-800: #292524;
    --stone-900: #1c1917;
    --accent: #7c3aed; --accent-light: #ede9fe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--stone-100); color: var(--stone-800);
    min-height: 100vh; padding: 24px;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center; margin-bottom: 32px;
  }
  .header h1 {
    font-size: 28px; font-weight: 800; color: var(--stone-900);
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 13px; color: var(--stone-500); margin-top: 6px;
  }

  /* Stats Cards */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #fff; border-radius: 14px; padding: 20px 22px;
    border: 1px solid var(--stone-200);
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .stat-card:hover {
    box-shadow: 0 4px 16px rgba(28,25,23,0.08);
    transform: translateY(-2px);
  }
  .stat-card .label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--stone-500); margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 36px; font-weight: 800; color: var(--stone-900);
    line-height: 1;
  }
  .stat-card .hint {
    font-size: 11px; color: var(--stone-400); margin-top: 6px;
  }
  .stat-card.accent .value { color: var(--accent); }

  /* Charts */
  .charts-row {
    display: grid; grid-template-columns: 1fr 2fr; gap: 16px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: #fff; border-radius: 14px; padding: 22px;
    border: 1px solid var(--stone-200);
  }
  .chart-card h3 {
    font-size: 14px; font-weight: 700; color: var(--stone-700);
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; width: 100%; }
  .chart-wrap.pie { max-width: 260px; margin: 0 auto; }

  /* Table Section */
  .table-section {
    background: #fff; border-radius: 14px; padding: 22px;
    border: 1px solid var(--stone-200);
  }
  .table-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
  }
  .table-header h3 {
    font-size: 14px; font-weight: 700; color: var(--stone-700);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--stone-50); border: 1px solid var(--stone-200);
    border-radius: 8px; padding: 8px 14px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-size: 13px; color: var(--stone-800); width: 200px;
  }
  .search-box input::placeholder { color: var(--stone-400); }
  .search-box .icon { color: var(--stone-400); font-size: 14px; }

  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
  }
  .badge.input-prompt { background: #ede9fe; color: #6d28d9; }
  .badge.physical-skill { background: #dcfce7; color: #166534; }
  .badge.cat {
    background: var(--stone-100); color: var(--stone-600);
  }

  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  thead th {
    text-align: left; padding: 10px 12px; font-weight: 600;
    color: var(--stone-500); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; border-bottom: 2px solid var(--stone-200);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--stone-700); }
  thead th .arrow { margin-left: 4px; font-size: 10px; }
  tbody tr {
    border-bottom: 1px solid var(--stone-100);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--stone-50); }
  tbody td {
    padding: 10px 12px; color: var(--stone-700);
    vertical-align: middle;
  }
  tbody td.desc { color: var(--stone-500); max-width: 360px; }
  .table-footer {
    margin-top: 12px; font-size: 12px; color: var(--stone-400);
    text-align: center;
  }
  .no-results {
    text-align: center; padding: 32px; color: var(--stone-400);
    font-size: 14px;
  }

  /* Apps Section */
  .apps-section {
    background: #fff; border-radius: 14px; padding: 22px;
    border: 1px solid var(--stone-200); margin-top: 16px;
  }
  .apps-section h3 {
    font-size: 14px; font-weight: 700; color: var(--stone-700); margin-bottom: 12px;
  }
  .app-chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .app-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--stone-50); border: 1px solid var(--stone-200);
    border-radius: 10px; padding: 10px 16px; font-size: 13px;
    font-weight: 600; color: var(--stone-700);
  }
  .app-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; flex-shrink: 0;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .search-box input { width: 140px; }
  }
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>📊 Skill Counting Report</h1>
    <div class="subtitle" id="loadTime"></div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-card">
      <h3>Skill Kind 分佈</h3>
      <div class="chart-wrap pie">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Category 分佈</h3>
      <div class="chart-wrap">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Skill Table -->
  <div class="table-section">
    <div class="table-header">
      <h3>完整 Skill 清單 (<span id="tableCount">0</span>)</h3>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋 ID、名稱、描述...">
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th data-col="id"># <span class="arrow"></span></th>
          <th data-col="id">ID <span class="arrow"></span></th>
          <th data-col="name">名稱 <span class="arrow"></span></th>
          <th data-col="kind">Kind <span class="arrow"></span></th>
          <th data-col="category">Category <span class="arrow"></span></th>
          <th data-col="description">描述 <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="no-results" id="noResults" style="display:none">沒有符合的結果</div>
  </div>

  <!-- Apps -->
  <div class="apps-section" id="appsSection"></div>

</div>

<script>
// ─── Data (from _skill_data.json) ─────────────────────────
const DATA = {
  "skills": [
    {"id":"aioc-tour","kind":"input-prompt","name":"AIOC 導覽","description":"互動式導覽，帶領操作員認識 AIOC 的概念、架構、操作流程與核心價值","category":"tutorial"},
    {"id":"api-health-check","kind":"input-prompt","name":"api-health-check","description":"","category":""},
    {"id":"app-curator","kind":"input-prompt","name":"app-curator","description":"","category":""},
    {"id":"bug-review","kind":"input-prompt","name":"Bug Review","description":"分析缺陷報告，定位根因，評估影響範圍與修復建議","category":""},
    {"id":"claude-code-test","kind":"input-prompt","name":"Claude Code CLI Test","description":"使用 Claude Code CLI 測試 skill 載入與基本操作","category":""},
    {"id":"cli-test","kind":"input-prompt","name":"cli-test","description":"測試不同的 AI CLI 工具（Qwen、Claude Code、OpenCode），驗證 skill 載入與基本操作","category":""},
    {"id":"collect-inputs","kind":"input-prompt","name":"collect-inputs","description":"","category":""},
    {"id":"contract-validation","kind":"input-prompt","name":"Contract Validation","description":"驗證程式碼是否符合 node contract 規範","category":""},
    {"id":"dashboard-setup","kind":"input-prompt","name":"dashboard-setup","description":"在目標專案建立 AIOC Dashboard 所需的目錄與資料結構（.aioc/dashboard.json）","category":""},
    {"id":"define-api-contracts","kind":"input-prompt","name":"Define API Contracts","description":"定義 API 與 Data contracts（JSON Schema）","category":""},
    {"id":"diagnosis","kind":"input-prompt","name":"Diagnosis","description":"系統性診斷流程，從訊號收集到問題確認的結構化步驟","category":""},
    {"id":"draft-flow-specs","kind":"input-prompt","name":"Draft Flow Specs","description":"使用 DSL 草擬 orchestrator flow","category":""},
    {"id":"endpoint-probe","kind":"input-prompt","name":"Endpoint Probe","description":"對 API Endpoint 執行深度探測，測試各種邊界條件與錯誤處理","category":""},
    {"id":"extract-user-stories","kind":"input-prompt","name":"Extract User Stories","description":"從需求文件或 legacy code 中提取 user stories","category":""},
    {"id":"factory-constitution","kind":"input-prompt","name":"建立工廠制度","description":"協助制定工廠的憲法、標準規範、Error Code Rules 與團隊規則","category":"setup"},
    {"id":"factory-tour","kind":"input-prompt","name":"factory-tour","description":"AI 軟體工廠導覽，帶領新成員了解工廠架構、流程、規範與 AI 員工團隊","category":""},
    {"id":"health-check-design","kind":"input-prompt","name":"Health Check Design","description":"為 API 服務設計標準化的 Health Check Endpoint 與監控架構","category":""},
    {"id":"incident-detection","kind":"input-prompt","name":"Incident Detection","description":"分析 API 異常數據，判斷是否為事故，提供分級與應變建議","category":""},
    {"id":"incident-support","kind":"input-prompt","name":"Incident Support","description":"在事件發生時提供即時故障排除支援，協助快速恢復服務","category":""},
    {"id":"java-unit-test","kind":"input-prompt","name":"java-unit-test","description":"為 Java 程式碼撰寫 JUnit 單元測試","category":""},
    {"id":"node-codegen","kind":"input-prompt","name":"Code Generation","description":"根據規格生成符合 contract 的節點程式","category":""},
    {"id":"opencode-test","kind":"input-prompt","name":"OpenCode CLI Test","description":"使用 OpenCode CLI 測試 skill 載入與基本操作","category":""},
    {"id":"quality-gate","kind":"input-prompt","name":"Quality Gate","description":"執行完整的品質閘門檢查，確認交付物可以進入下一階段","category":""},
    {"id":"quick-tour","kind":"input-prompt","name":"Quick Tour","description":"AIOC 快速導覽，直接進 CLI 互動式介紹工廠","category":""},
    {"id":"root-cause","kind":"input-prompt","name":"Root Cause Analysis","description":"根據異常訊號與系統架構，進行根因分析，定位問題源頭","category":""},
    {"id":"signal-detect","kind":"input-prompt","name":"Signal Detection","description":"分析系統訊號（Logs / Metrics / Traces），快速偵測異常模式","category":""},
    {"id":"skill-creation","kind":"input-prompt","name":"Skill 建立","description":"設計並建立新的 Skill 定義，產出完整的 SKILL.md 到 skills/ 目錄","category":"generation"},
    {"id":"skill-design","kind":"input-prompt","name":"Skill Design","description":"使用 skill-creator 方法論設計新的 AI 技能，從需求到完整的 SKILL.md","category":""},
    {"id":"skill-forging","kind":"input-prompt","name":"Skill 鍛造","description":"從零鍛造一個完整的 Skill，涵蓋 ID 設計、Role Prompt、Inputs/Outputs、Rules、Guardrails，並可選擇打包為實體 Skill Package","category":"generation"},
    {"id":"skill-packing","kind":"input-prompt","name":"Skill 打包","description":"將 input-prompt skill 打包為可部署的 physical-skill package，含目錄結構、README、腳本範本","category":"workflow"},
    {"id":"skill-testing","kind":"input-prompt","name":"Skill 測試","description":"測試已建立的 Skill 定義是否正確運作，驗證 frontmatter、userInputs、prompt 輸出","category":"testing"},
    {"id":"sla-monitor","kind":"input-prompt","name":"SLA Monitor","description":"定義與監控服務等級指標（SLI/SLO/SLA），追蹤服務品質達成率","category":""},
    {"id":"spec-check","kind":"input-prompt","name":"Spec Check","description":"檢查規格文件是否完整、清楚、可被工程師與 AI 理解","category":""},
    {"id":"test-design","kind":"input-prompt","name":"Test Cases Design","description":"根據規格設計完整的測試案例，覆蓋正常流程、邊界條件與錯誤情境","category":""},
    {"id":"test-generation","kind":"input-prompt","name":"Test Generation","description":"為節點程式生成完整的測試案例","category":""},
    {"id":"daily-stats","kind":"physical-skill","name":"Daily Stats","description":"每日系統統計儀表板 — AI 使用量、Build 次數、活躍工廠數","category":"dashboard"}
  ],
  "apps": [
    {"id":"daily-stats","name":"Daily Stats","status":"published"},
    {"id":"project-board","name":"Project Board","status":"published"},
    {"id":"skill-counting-report","name":"Skill Counting Report","status":"published"}
  ]
};

// ─── Computed Stats ───────────────────────────────────────
const skills = DATA.skills;
const apps = DATA.apps;
const totalSkills = skills.length;
const inputPromptCount = skills.filter(s => s.kind === 'input-prompt').length;
const physicalCount = skills.filter(s => s.kind === 'physical-skill').length;

// Categories
const catMap = {};
skills.forEach(s => {
  const c = s.category || '(未分類)';
  catMap[c] = (catMap[c] || 0) + 1;
});
const categories = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

// ─── Load Time ────────────────────────────────────────────
document.getElementById('loadTime').textContent =
  '載入時間：' + new Date().toLocaleString('zh-TW', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

// ─── Stats Cards ──────────────────────────────────────────
const statsGrid = document.getElementById('statsGrid');
const cards = [
  { label: 'Total Skills', value: totalSkills, hint: '所有已登錄的 Skills', accent: true },
  { label: 'Input-Prompt', value: inputPromptCount, hint: '提示型 Skills', accent: false },
  { label: 'Physical Skills', value: physicalCount, hint: '實體部署型 Skills', accent: false },
  { label: 'Apps', value: apps.length, hint: '已發佈的應用', accent: false },
];
cards.forEach(c => {
  const div = document.createElement('div');
  div.className = 'stat-card' + (c.accent ? ' accent' : '');
  div.innerHTML = `<div class="label">${c.label}</div><div class="value">${c.value}</div><div class="hint">${c.hint}</div>`;
  statsGrid.appendChild(div);
});

// ─── Pie Chart (Kind) ─────────────────────────────────────
new Chart(document.getElementById('pieChart'), {
  type: 'doughnut',
  data: {
    labels: ['input-prompt', 'physical-skill'],
    datasets: [{
      data: [inputPromptCount, physicalCount],
      backgroundColor: ['#7c3aed', '#22c55e'],
      borderWidth: 0,
      hoverOffset: 6,
    }]
  },
  options: {
    cutout: '62%',
    plugins: {
      legend: { position: 'bottom', labels: { padding: 16, font: { size: 12 } } },
      tooltip: {
        callbacks: {
          label: ctx => ` ${ctx.label}: ${ctx.parsed} (${((ctx.parsed / totalSkills) * 100).toFixed(1)}%)`
        }
      }
    }
  }
});

// ─── Bar Chart (Category) ─────────────────────────────────
const barColors = ['#7c3aed','#a78bfa','#c4b5fd','#8b5cf6','#6d28d9','#5b21b6','#4c1d95'];
new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: categories.map(([k]) => k),
    datasets: [{
      data: categories.map(([, v]) => v),
      backgroundColor: categories.map((_, i) => barColors[i % barColors.length]),
      borderRadius: 6,
      maxBarThickness: 48,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.x} skills` }
      }
    },
    scales: {
      x: {
        beginAtZero: true,
        ticks: { stepSize: 1, font: { size: 11 } },
        grid: { color: '#f5f5f4' }
      },
      y: {
        ticks: { font: { size: 12 } },
        grid: { display: false }
      }
    }
  }
});

// ─── Table ────────────────────────────────────────────────
const tbody = document.getElementById('tableBody');
const tableCount = document.getElementById('tableCount');
const noResults = document.getElementById('noResults');
let sortCol = 'id';
let sortAsc = true;

function renderTable(filter = '') {
  const f = filter.toLowerCase();
  let rows = skills.filter(s =>
    s.id.toLowerCase().includes(f) ||
    s.name.toLowerCase().includes(f) ||
    (s.description || '').toLowerCase().includes(f) ||
    s.kind.toLowerCase().includes(f) ||
    (s.category || '').toLowerCase().includes(f)
  );

  rows.sort((a, b) => {
    let va = a[sortCol] || '', vb = b[sortCol] || '';
    if (sortCol === 'id') { va = a.id; vb = b.id; }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return sortAsc ? (va < vb ? -1 : va > vb ? 1 : 0) : (va > vb ? -1 : va < vb ? 1 : 0);
  });

  tbody.innerHTML = rows.map((s, i) => {
    const cat = s.category || '—';
    const kindBadge = `<span class="badge ${s.kind}">${s.kind}</span>`;
    const catBadge = s.category ? `<span class="badge cat">${s.category}</span>` : '—';
    return `<tr>
      <td style="color:var(--stone-400);font-size:11px">${i + 1}</td>
      <td><code style="font-size:12px;color:var(--stone-800)">${s.id}</code></td>
      <td style="font-weight:600">${s.name}</td>
      <td>${kindBadge}</td>
      <td>${catBadge}</td>
      <td class="desc">${s.description || '<span style="color:var(--stone-300)">—</span>'}</td>
    </tr>`;
  }).join('');

  tableCount.textContent = rows.length;
  noResults.style.display = rows.length === 0 ? 'block' : 'none';
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (!col) return;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll('thead th .arrow').forEach(a => a.textContent = '');
    th.querySelector('.arrow').textContent = sortAsc ? '▲' : '▼';
    renderTable(document.getElementById('searchInput').value);
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  renderTable(e.target.value);
});

renderTable();

// ─── Apps Section ─────────────────────────────────────────
const appsSection = document.getElementById('appsSection');
appsSection.innerHTML = `<h3>已發佈的 Apps (${apps.length})</h3>
  <div class="app-chips">${apps.map(a =>
    `<div class="app-chip"><span class="dot"></span>${a.name}</div>`
  ).join('')}</div>`;
</script>
</body>
</html>
