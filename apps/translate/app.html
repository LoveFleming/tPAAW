<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 翻譯器 — Translate App</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1b26;
    --surface2: #24253a;
    --border: #2e3047;
    --text: #e1e2e8;
    --text2: #8b8fa3;
    --accent: #7c5cfc;
    --accent2: #5b3fd4;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .header-icon { font-size: 24px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--text2); margin-left: auto; }

  /* Main */
  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* Left Panel — Input */
  .input-panel {
    width: 45%; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .panel-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text2);
  }
  .lang-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
  }
  .lang-select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .lang-select:focus { outline: none; border-color: var(--accent); }
  .swap-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50%; width: 28px; height: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text2); transition: all 0.2s;
  }
  .swap-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .input-area {
    flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px;
  }
  .source-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; font-size: 15px;
    color: var(--text); resize: none; line-height: 1.7;
    font-family: inherit;
  }
  .source-input:focus { outline: none; border-color: var(--accent); }

  .action-bar { display: flex; gap: 8px; align-items: center; }
  .translate-btn {
    flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 12px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .translate-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .translate-btn:active { transform: translateY(0); }
  .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .char-count { font-size: 11px; color: var(--text2); text-align: right; }

  /* Right Panel — Output */
  .output-panel {
    width: 55%; display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
  }

  .output-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .tab {
    padding: 10px 20px; font-size: 12px; font-weight: 600;
    color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .output-content {
    flex: 1; overflow-y: auto; padding: 20px 24px;
  }

  /* Copy button */
  .copy-btn {
    float: right; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 11px;
    color: var(--text2); cursor: pointer; transition: all 0.2s;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Translation Tables */
  .t-table {
    width: 100%; border-collapse: collapse; margin-bottom: 16px;
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
  }
  .t-table th, .t-table td {
    padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
    font-size: 13px; line-height: 1.6; vertical-align: top;
  }
  .t-table th {
    width: 90px; color: var(--text2); font-weight: 600; font-size: 12px;
    white-space: nowrap; background: var(--surface2);
  }
  .t-table td { color: var(--text); }
  .t-table tr:last-child th, .t-table tr:last-child td { border-bottom: none; }
  .t-highlight {
    font-size: 18px !important; font-weight: 700; color: var(--green) !important;
    letter-spacing: 0.3px;
  }
  .t-chip {
    display: inline-block; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 10px; margin: 2px 4px 2px 0;
    font-size: 12px; color: var(--text);
  }
  .t-section-title {
    font-size: 13px; font-weight: 700; color: var(--accent);
    margin: 16px 0 8px 2px; display: flex; align-items: center; gap: 6px;
  }
  .t-usage { font-weight: 600; color: var(--text); }
  .t-colloc { font-weight: 600; color: var(--blue); }
  .t-sentence { font-size: 14px !important; color: var(--text) !important; line-height: 1.8 !important; }
  .t-sentence-zh { color: var(--text2) !important; }
  .t-table.t-fun td {
    background: linear-gradient(135deg, #7c5cfc08, #fbbf2408);
    line-height: 1.7;
  }

  /* History — Zoomable Cards */
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .history-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(124, 92, 252, 0.12); }

  .history-card-preview {
    padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .history-card-body { flex: 1; min-width: 0; }
  .history-card-source {
    font-size: 12px; color: var(--text2); margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-card-result {
    font-size: 14px; color: var(--text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-card-meta {
    flex-shrink: 0; text-align: right; white-space: nowrap;
  }
  .history-card-time {
    font-size: 10px; color: var(--text2); opacity: 0.6;
  }
  .history-card-expand {
    font-size: 10px; color: var(--accent); margin-top: 4px;
    transition: transform 0.3s;
  }

  .history-card-detail {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s;
    padding: 0 16px;
  }
  .history-card.expanded {
    transform: scale(1.02);
    border-color: var(--accent);
    box-shadow: 0 6px 24px rgba(124, 92, 252, 0.18);
  }
  .history-card.expanded .history-card-detail {
    max-height: 600px;
    padding: 0 16px 16px 16px;
    overflow-y: auto;
  }
  .history-card.expanded .history-card-expand {
    transform: rotate(180deg);
  }

  .history-detail-divider {
    height: 1px; background: var(--border); margin-bottom: 12px;
  }
  .history-detail-row {
    display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px;
  }
  .history-detail-label {
    flex-shrink: 0; width: 60px; color: var(--text2); font-size: 11px;
    font-weight: 600; padding-top: 2px;
  }
  .history-detail-value {
    color: var(--text); line-height: 1.6; word-break: break-word;
  }
  .history-detail-value.highlight {
    font-size: 16px; font-weight: 700; color: var(--green);
  }

  /* Empty state */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: var(--text2);
    text-align: center; gap: 12px;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 14px; }
  .empty-hint { font-size: 12px; color: var(--text2); opacity: 0.6; }

  /* Loading */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 200px; gap: 8px;
  }
  .loading-dots { display: flex; gap: 8px; }
  .loading-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }
  .loading-hint { margin-top: 12px; color: var(--text2); font-size: 12px; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .input-panel, .output-panel { width: 100%; }
    .input-panel { height: 45%; }
    .output-panel { height: 55%; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🌐</span>
    <span class="header-title">翻譯器 Translate</span>
    <span class="header-sub">中 → 英 ｜ 特殊詞彙 × 例句 × 笑話</span>
  </div>

  <div class="main">
    <!-- Left: Input -->
    <div class="input-panel">
      <div class="lang-bar">
        <select class="lang-select" id="sourceLang">
          <option value="zh-TW" selected>🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
        <button class="swap-btn" onclick="swapLangs()" title="互換語言">⇄</button>
        <select class="lang-select" id="targetLang">
          <option value="en" selected>🇺🇸 English</option>
          <option value="zh-TW">🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
      </div>
      <div class="input-area">
        <textarea class="source-input" id="sourceInput" placeholder="輸入要翻譯的文字..."></textarea>
        <div class="char-count"><span id="charCount">0</span> 字</div>
        <div class="action-bar">
          <button class="translate-btn" id="translateBtn" onclick="doTranslate()">🌐 翻譯 Translate</button>
        </div>
      </div>
    </div>

    <!-- Right: Output -->
    <div class="output-panel">
      <div class="output-tabs">
        <div class="tab active" data-tab="result" onclick="switchTab('result')">📝 翻譯結果</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')">📜 歷史 <span id="historyCount" style="font-size:10px;opacity:0.6">0</span></div>
      </div>
      <div class="output-content" id="outputContent">
        <div class="empty" id="emptyState">
          <div class="empty-icon">🌐</div>
          <div class="empty-text">在左邊輸入文字，點擊翻譯</div>
          <div class="empty-hint">特殊詞彙會自動包裝成例句和笑話 ✨</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──
const API_BASE = window.location.origin;
let history = [];
let currentTab = 'result';
let lastTranslation = null;

// ── Init ──
const sourceInput = document.getElementById('sourceInput');
const charCount = document.getElementById('charCount');
const translateBtn = document.getElementById('translateBtn');

// Load history from server
async function loadServerHistory() {
  try {
    const resp = await fetch(`${API_BASE}/api/app-data/translate`);
    if (resp.ok) {
      const data = await resp.json();
      history = data.map(r => ({
        id: r.id,
        source: r.source_text || '',
        result: { translation: r.translated_text || '', special_words: [] },
        sourceLang: r.source_lang || 'zh-TW',
        targetLang: r.target_lang || 'en',
        ts: r.createdAt || new Date().toISOString(),
        highlights: r.highlights || '',
      }));
      document.getElementById('historyCount').textContent = history.length;
      if (currentTab === 'history') renderHistory();
    }
  } catch (err) {
    console.error('[translate] Load history failed:', err);
  }
}
loadServerHistory();

sourceInput.addEventListener('input', () => {
  charCount.textContent = sourceInput.value.length;
});

sourceInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    doTranslate();
  }
});

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'history') renderHistory();
  else renderResult();
}

// ── Swap languages ──
function swapLangs() {
  const s = document.getElementById('sourceLang');
  const t = document.getElementById('targetLang');
  const tmp = s.value;
  s.value = t.value;
  t.value = tmp;
}

// ── Translate ──
async function doTranslate() {
  const text = sourceInput.value.trim();
  if (!text) return;

  const sourceLang = document.getElementById('sourceLang').value;
  const targetLang = document.getElementById('targetLang').value;

  translateBtn.disabled = true;
  translateBtn.textContent = '⏳ 翻譯中...';

  // Switch to result tab immediately
  switchTab('result');
  const output = document.getElementById('outputContent');
  output.innerHTML = '<div class="loading"><div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><p class="loading-hint">Skill 執行中...</p></div>';

  try {
    const resp = await fetch('/api/app/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source_text: text, source_lang: sourceLang, target_lang: targetLang })
    });

    if (!resp.ok) throw new Error(`API error: ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let ndjson = '';
    let lastResult = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      ndjson += decoder.decode(value, { stream: true });

      const lines = ndjson.split('\n');
      ndjson = lines.pop() || '';
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const msg = JSON.parse(line);
          if (msg.type === 'result') lastResult = msg.data;
        } catch {}
      }
    }

    if (ndjson.trim()) {
      try {
        const msg = JSON.parse(ndjson);
        if (msg.type === 'result') lastResult = msg.data;
      } catch {}
    }

    if (!lastResult) throw new Error('No result from skill execution');

    // Save to server
    try {
      await fetch(`${API_BASE}/api/app-data/translate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source_text: text,
          source_lang: sourceLang,
          target_lang: targetLang,
          translated_text: lastResult.translation || '',
          highlights: (lastResult.special_words || []).map(w => `${w.word} (${w.type}) → ${w.translation}`).join(' | ')
        })
      });
      loadServerHistory();
    } catch {}

    lastTranslation = lastResult;
    renderTranslation(lastResult);
  } catch (err) {
    output.innerHTML = `<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">翻譯失敗：${escHtml(err.message)}</div></div>`;
  } finally {
    translateBtn.disabled = false;
    translateBtn.textContent = '🌐 翻譯 Translate';
  }
}

// ── Render Translation Result ──
function renderTranslation(data) {
  const output = document.getElementById('outputContent');
  const pkg = data.special_words?.[0]?.packaged;
  const swm = data.single_word_mode;
  let html = '';

  html += `<div style="text-align:right;margin-bottom:8px">
    <button class="copy-btn" onclick="copyText(this, '${escapeAttr(data.translation)}')">📋 複製</button>
  </div>`;

  // Main translation table
  html += '<table class="t-table">';
  html += `<tr><th>原文</th><td>${escHtml(data.source_text)}</td></tr>`;
  html += `<tr><th>Translation</th><td class="t-highlight">${escHtml(data.translation)}</td></tr>`;
  if (pkg?.phonetic || swm?.phonetic)
    html += `<tr><th>音標</th><td>🔊 ${escHtml(pkg?.phonetic || swm?.phonetic)}</td></tr>`;
  if (pkg?.part_of_speech || swm?.part_of_speech)
    html += `<tr><th>詞性</th><td>${escHtml(pkg?.part_of_speech || swm?.part_of_speech)}</td></tr>`;
  if (pkg?.definition)
    html += `<tr><th>釋義</th><td>${escHtml(pkg.definition)}</td></tr>`;
  html += '</table>';

  // Synonyms / Antonyms
  if (swm?.synonyms?.length || swm?.antonyms?.length) {
    html += '<table class="t-table">';
    if (swm.synonyms?.length)
      html += `<tr><th>同義詞</th><td>${swm.synonyms.map(s => `<span class="t-chip">${escHtml(s)}</span>`).join('')}</td></tr>`;
    if (swm.antonyms?.length)
      html += `<tr><th>反義詞</th><td>${swm.antonyms.map(s => `<span class="t-chip">${escHtml(s)}</span>`).join('')}</td></tr>`;
    html += '</table>';
  }

  // Common usage
  if (swm?.common_usage?.length) {
    html += '<div class="t-section-title">📝 常見用法</div>';
    html += '<table class="t-table"><tr><th style="width:auto">用法</th><th style="width:auto">意思</th></tr>';
    swm.common_usage.forEach(u => {
      const parts = u.split(' — ');
      html += `<tr><td class="t-usage">${escHtml(parts[0])}</td><td>${escHtml(parts[1] || '')}</td></tr>`;
    });
    html += '</table>';
  }

  // Collocations
  if (swm?.collocations?.length) {
    html += '<div class="t-section-title">🔗 搭配詞</div>';
    html += '<table class="t-table"><tr><th style="width:auto">搭配</th><th style="width:auto">意思</th></tr>';
    swm.collocations.forEach(c => {
      const m = c.match(/^(\S+)\s+(.+)$/);
      if (m) html += `<tr><td class="t-colloc">${escHtml(m[1])}</td><td>${escHtml(m[2])}</td></tr>`;
      else html += `<tr><td colspan="2">${escHtml(c)}</td></tr>`;
    });
    html += '</table>';
  }

  // Classic sentence
  const cs = pkg?.classic_sentence;
  if (cs) {
    html += '<div class="t-section-title">📖 經典例句</div>';
    html += '<table class="t-table">';
    html += `<tr><th>EN</th><td class="t-sentence">${escHtml(cs.en || '')}</td></tr>`;
    if (cs.zh) html += `<tr><th>ZH</th><td class="t-sentence-zh">${escHtml(cs.zh)}</td></tr>`;
    html += '</table>';
  }

  // Fun fact
  const ff = pkg?.fun_fact;
  if (ff?.content) {
    html += '<div class="t-section-title">💡 趣味記憶</div>';
    html += '<table class="t-table t-fun">';
    if (ff.type) html += `<tr><th>${escHtml(ff.type)}</th><td>${escHtml(ff.content)}</td></tr>`;
    else html += `<tr><td>${escHtml(ff.content)}</td></tr>`;
    html += '</table>';
  }

  output.innerHTML = html;
}

function renderResult() {
  if (lastTranslation) renderTranslation(lastTranslation);
}

// ── Render History — Zoomable Cards ──
function renderHistory() {
  const output = document.getElementById('outputContent');
  if (history.length === 0) {
    output.innerHTML = '<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">還沒有翻譯歷史</div></div>';
    return;
  }
  let html = '<div class="history-list">';
  history.forEach((h, idx) => {
    const time = new Date(h.ts).toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const translation = h.result?.translation || h.translated_text || '';
    const source = h.source || h.source_text || '';
    const highlights = h.highlights || '';
    html += `<div class="history-card" onclick="toggleHistoryCard(this)">
      <div class="history-card-preview">
        <div class="history-card-body">
          <div class="history-card-source">${escHtml(source)}</div>
          <div class="history-card-result">${escHtml(translation)}</div>
        </div>
        <div class="history-card-meta">
          <div class="history-card-time">${time}</div>
          <div class="history-card-expand">▼</div>
        </div>
      </div>
      <div class="history-card-detail">
        <div class="history-detail-divider"></div>
        <div class="history-detail-row">
          <div class="history-detail-label">原文</div>
          <div class="history-detail-value">${escHtml(source)}</div>
        </div>
        <div class="history-detail-row">
          <div class="history-detail-label">Translation</div>
          <div class="history-detail-value highlight">${escHtml(translation)}</div>
        </div>
        ${h.sourceLang ? `<div class="history-detail-row"><div class="history-detail-label">來源</div><div class="history-detail-value">${escHtml(h.sourceLang)}</div></div>` : ''}
        ${h.targetLang ? `<div class="history-detail-row"><div class="history-detail-label">目標</div><div class="history-detail-value">${escHtml(h.targetLang)}</div></div>` : ''}
        ${highlights ? `<div class="history-detail-row"><div class="history-detail-label">詞彙</div><div class="history-detail-value">${escHtml(highlights)}</div></div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  output.innerHTML = html;
}

function toggleHistoryCard(card) {
  const wasExpanded = card.classList.contains('expanded');
  // Collapse all others
  document.querySelectorAll('.history-card.expanded').forEach(c => {
    if (c !== card) c.classList.remove('expanded');
  });
  card.classList.toggle('expanded', !wasExpanded);
}

// ── Helpers ──
function escHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { if (!s) return ''; return s.replace(/\\/g,'\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ 已複製';
    setTimeout(() => btn.textContent = '📋 複製', 1500);
  });
}

document.getElementById('historyCount').textContent = '...';
</script>
