<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 翻譯器 — Translate App</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1b26;
    --surface2: #24253a;
    --border: #2e3047;
    --text: #e1e2e8;
    --text2: #8b8fa3;
    --accent: #7c5cfc;
    --accent2: #5b3fd4;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .header-icon { font-size: 24px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--text2); margin-left: auto; }

  /* Main */
  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* Left Panel — Input */
  .input-panel {
    width: 45%; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .panel-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text2);
  }
  .lang-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
  }
  .lang-select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .lang-select:focus { outline: none; border-color: var(--accent); }
  .swap-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50%; width: 28px; height: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text2); transition: all 0.2s;
  }
  .swap-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .input-area {
    flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px;
  }
  .source-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; font-size: 15px;
    color: var(--text); resize: none; line-height: 1.7;
    font-family: inherit;
  }
  .source-input:focus { outline: none; border-color: var(--accent); }
  .source-input::placeholder { color: var(--text2); }

  .action-bar { display: flex; gap: 8px; align-items: center; }
  .translate-btn {
    flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 12px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .translate-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .translate-btn:active { transform: translateY(0); }
  .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .char-count { font-size: 11px; color: var(--text2); text-align: right; }

  /* Right Panel — Output */
  .output-panel {
    width: 55%; display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
  }

  .output-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .tab {
    padding: 10px 20px; font-size: 12px; font-weight: 600;
    color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .output-content {
    flex: 1; overflow-y: auto; padding: 20px 24px;
  }

  /* Translation result */
  .translation-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .translation-label {
    font-size: 11px; color: var(--text2); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .translation-text {
    font-size: 18px; line-height: 1.8; font-weight: 500;
  }
  .copy-btn {
    float: right; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 11px;
    color: var(--text2); cursor: pointer; transition: all 0.2s;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Special words */
  .special-section { margin-top: 20px; }
  .special-title {
    font-size: 13px; font-weight: 700; color: var(--amber);
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .special-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .special-word {
    font-size: 16px; font-weight: 700; color: var(--green);
    display: flex; align-items: center; gap: 8px;
  }
  .special-word .type-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 99px;
    font-weight: 600;
  }
  .type-idiom { background: #7c5cfc20; color: #7c5cfc; }
  .type-slang { background: #fbbf2420; color: #fbbf24; }
  .type-jargon { background: #60a5fa20; color: #60a5fa; }
  .type-culture { background: #f8717120; color: #f87171; }
  .type-pun { background: #4ade8020; color: #4ade80; }

  .special-trans {
    font-size: 13px; color: var(--text2); margin-top: 4px; margin-bottom: 12px;
  }
  .example-box {
    background: var(--surface2); border-radius: 8px; padding: 12px;
    margin-top: 8px;
  }
  .example-label {
    font-size: 10px; color: var(--accent); font-weight: 700;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .example-en { font-size: 14px; color: var(--text); line-height: 1.6; }
  .example-zh { font-size: 12px; color: var(--text2); margin-top: 4px; }

  .fun-box {
    background: linear-gradient(135deg, #7c5cfc10, #fbbf2410);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-top: 8px;
  }
  .fun-label {
    font-size: 10px; color: var(--amber); font-weight: 700;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .fun-content { font-size: 13px; line-height: 1.6; color: var(--text); }

  /* History */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-source { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .history-result { font-size: 13px; color: var(--text); }

  /* Empty state */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: var(--text2);
    text-align: center; gap: 12px;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 14px; }
  .empty-hint { font-size: 12px; color: var(--text2); opacity: 0.6; }

  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; gap: 8px;
  }
  .loading-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .input-panel, .output-panel { width: 100%; }
    .input-panel { height: 45%; }
    .output-panel { height: 55%; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🌐</span>
    <span class="header-title">翻譯器 Translate</span>
    <span class="header-sub">中 → 英 ｜ 特殊詞彙 × 例句 × 笑話</span>
  </div>

  <div class="main">
    <!-- Left: Input -->
    <div class="input-panel">
      <div class="lang-bar">
        <select class="lang-select" id="sourceLang">
          <option value="zh-TW" selected>🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
        <button class="swap-btn" onclick="swapLangs()" title="互換語言">⇄</button>
        <select class="lang-select" id="targetLang">
          <option value="en" selected>🇺🇸 English</option>
          <option value="zh-TW">🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
      </div>
      <div class="input-area">
        <textarea class="source-input" id="sourceInput"
          placeholder="輸入要翻譯的文字...\n\n例：這個功能對我們來說至關重要，請務必在截止日期前完成。\n\n或單字：機會"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span> 字</div>
        <div class="action-bar">
          <button class="translate-btn" id="translateBtn" onclick="doTranslate()">🌐 翻譯 Translate</button>
        </div>
      </div>
    </div>

    <!-- Right: Output -->
    <div class="output-panel">
      <div class="output-tabs">
        <div class="tab active" data-tab="result" onclick="switchTab('result')">📝 翻譯結果</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')">📜 歷史 <span id="historyCount" style="font-size:10px;opacity:0.6">0</span></div>
      </div>
      <div class="output-content" id="outputContent">
        <!-- Default: empty state -->
        <div class="empty" id="emptyState">
          <div class="empty-icon">🌐</div>
          <div class="empty-text">在左邊輸入文字，點擊翻譯</div>
          <div class="empty-hint">特殊詞彙會自動包裝成例句和笑話 ✨</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──
let history = JSON.parse(localStorage.getItem('translate_history') || '[]');
let currentTab = 'result';

// ── Init ──
const sourceInput = document.getElementById('sourceInput');
const charCount = document.getElementById('charCount');
const translateBtn = document.getElementById('translateBtn');

sourceInput.addEventListener('input', () => {
  charCount.textContent = sourceInput.value.length;
});

// Ctrl+Enter to translate
sourceInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    doTranslate();
  }
});

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'history') renderHistory();
  else renderResult();
}

// ── Swap languages ──
function swapLangs() {
  const s = document.getElementById('sourceLang');
  const t = document.getElementById('targetLang');
  const tmp = s.value;
  s.value = t.value;
  t.value = tmp;
}

// ── Translate ──
async function doTranslate() {
  const text = sourceInput.value.trim();
  if (!text) return;

  const sourceLang = document.getElementById('sourceLang').value;
  const targetLang = document.getElementById('targetLang').value;

  translateBtn.disabled = true;
  translateBtn.textContent = '⏳ Skill 執行中...';

  switchTab('result');
  const output = document.getElementById('outputContent');
  output.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><p style="margin-top:12px;color:var(--text2);font-size:12px">Skill → CLI 執行中...</p></div>';

  try {
    const res = await fetch('/api/app/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_text: text,
        source_lang: sourceLang,
        target_lang: targetLang
      })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // Read NDJSON stream
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let ndjson = '';
    let lastResult = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      ndjson += decoder.decode(value, { stream: true });

      // Parse each line
      const lines = ndjson.split('\n');
      ndjson = lines.pop() || ''; // keep incomplete line
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const msg = JSON.parse(line);
          if (msg.type === 'result') {
            lastResult = msg.data;
          }
        } catch {}
      }
    }

    // Also try to parse the last remaining ndjson
    if (ndjson.trim()) {
      try {
        const msg = JSON.parse(ndjson);
        if (msg.type === 'result') lastResult = msg.data;
      } catch {}
    }

    if (!lastResult) throw new Error('No result from skill execution');

    // Save to history
    const entry = {
      id: Date.now(),
      source: text,
      result: lastResult,
      sourceLang, targetLang,
      ts: new Date().toISOString()
    };
    history.unshift(entry);
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem('translate_history', JSON.stringify(history));
    document.getElementById('historyCount').textContent = history.length;

    renderTranslation(lastResult);
  } catch (err) {
    output.innerHTML = `<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">翻譯失敗：${err.message}</div></div>`;
  } finally {
    translateBtn.disabled = false;
    translateBtn.textContent = '🌐 翻譯 Translate';
  }
}

// ── Render ──
function renderTranslation(data) {
  const output = document.getElementById('outputContent');
  let html = '';

  // Main translation
  html += `<div class="translation-box">
    <button class="copy-btn" onclick="copyText(this, '${escapeAttr(data.translation)}')">📋 複製</button>
    <div class="translation-label">Translation</div>
    <div class="translation-text">${escHtml(data.translation)}</div>
  </div>`;

  // Special words
  if (data.special_words && data.special_words.length > 0) {
    html += `<div class="special-section">
      <div class="special-title">✨ 特殊詞彙 Highlight</div>`;
    data.special_words.forEach(w => {
      html += `<div class="special-card">
        <div class="special-word">
          ${escHtml(w.word)}
          <span class="type-badge type-${w.type}">${w.type}</span>
        </div>
        <div class="special-trans">${escHtml(w.translation)}</div>`;

      if (w.packaged) {
        if (w.packaged.classic_sentence) {
          html += `<div class="example-box">
            <div class="example-label">📖 經典例句</div>
            <div class="example-en">${escHtml(w.packaged.classic_sentence.en || w.packaged.classic_sentence)}</div>
            ${w.packaged.classic_sentence.zh ? `<div class="example-zh">${escHtml(w.packaged.classic_sentence.zh)}</div>` : ''}
          </div>`;
        }
        if (w.packaged.joke) {
          html += `<div class="fun-box">
            <div class="fun-label">😄 趣味記憶</div>
            <div class="fun-content">${escHtml(w.packaged.joke)}</div>
          </div>`;
        }
      }
      html += '</div>';
    });
    html += '</div>';
  }

  output.innerHTML = html;
}

function renderDemoResult(text, sLang, tLang) {
  // Demo mock for when API is not available
  const mockData = {
    translation: `[Demo] "${text}" → This is a demo translation. Connect to the Translate API for real results.`,
    source_lang: sLang,
    target_lang: tLang,
    source_text: text,
    special_words: [
      {
        word: "重要",
        translation: "important / crucial / vital",
        type: "culture",
        packaged: {
          classic_sentence: {
            en: "This meeting is of crucial importance to our company's future.",
            zh: "這場會議對我們公司的未來至關重要。"
          },
          joke: "📝 記憶法：important 有 \"import\"（進口），進口的東西都很重要！所以 important = 重要的。"
        }
      }
    ],
    pronunciation: { phonetic: null, audio_url: null }
  };
  renderTranslation(mockData);
}

function renderResult() {
  // Re-render current result if available
}

function renderHistory() {
  const output = document.getElementById('outputContent');
  if (history.length === 0) {
    output.innerHTML = '<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">還沒有翻譯歷史</div></div>';
    return;
  }
  let html = '<div class="history-list">';
  history.forEach(h => {
    const time = new Date(h.ts).toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    html += `<div class="history-item" onclick="replayHistory(${h.id})">
      <div class="history-source">${escHtml(h.source)} <span style="float:right;opacity:0.4;font-size:10px">${time}</span></div>
      <div class="history-result">${escHtml(h.result.translation || '')}</div>
    </div>`;
  });
  html += '</div>';
  output.innerHTML = html;
}

function replayHistory(id) {
  const h = history.find(x => x.id === id);
  if (!h) return;
  sourceInput.value = h.source;
  charCount.textContent = h.source.length;
  document.getElementById('sourceLang').value = h.sourceLang;
  document.getElementById('targetLang').value = h.targetLang;
  switchTab('result');
  renderTranslation(h.result);
}

// ── Helpers ──
function escHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { if (!s) return ''; return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ 已複製';
    setTimeout(() => btn.textContent = '📋 複製', 1500);
  });
}

// Init history count
document.getElementById('historyCount').textContent = history.length;
</script>
</body>
</html>
