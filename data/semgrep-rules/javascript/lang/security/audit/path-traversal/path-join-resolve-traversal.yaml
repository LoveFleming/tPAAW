rules:
- id: path-join-resolve-traversal
  message: >-
    Detected possible user input going into a `path.join` or `path.resolve`
    function. This could possibly lead to a path traversal vulnerability, 
    where the attacker can access arbitrary files stored in the file system.
    Instead, be sure to sanitize or validate user input first.
  metadata:
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    cwe:
    - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    category: security
    references:
    - https://owasp.org/www-community/attacks/Path_Traversal
    technology:
    - javascript
    - node.js
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: LOW
  languages:
  - javascript
  - typescript
  severity: WARNING
  mode: taint
  # 2026-10-02 PAAW 產品調校：source 從「任何函數參數」收緊到 HTTP 信任邊界（req.*）。
  # 原版對 local-first 工具的內部 lib（參數是常數路徑）全面誤報；PAAW 的外部輸入
  # 只從 HTTP handler 進來。內部函數參數不再是 source；guard helper 是 sanitizer。
  pattern-sources:
  - patterns:
    - focus-metavariable: $X
    - pattern-either:
      - pattern: req.query.$X
      - pattern: req.params.$X
      - pattern: req.body.$X
      - pattern: req.headers.$X
  - pattern-either:
      - pattern: req.url
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern-either:
        - patterns:
          - pattern: $REQ.query.$X
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?req(uest)?$
          - focus-metavariable: $X
        - patterns:
          - pattern: $REQ.params.$X
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?req(uest)?$
          - focus-metavariable: $X
        - patterns:
          - pattern: $REQ.body.$X
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?req(uest)?$
          - focus-metavariable: $X
        - patterns:
          - pattern: $REQ.headers.$X
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?req(uest)?$
          - focus-metavariable: $X
        - patterns:
          - pattern: $REQ.url
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?req(uest)?$
  pattern-sinks:
  - patterns:
    - focus-metavariable: $SINK
    - pattern-either:
      - pattern-inside: |
          $PATH = require('path');
          ...
      - pattern-inside: |
          import $PATH from 'path';
          ...
    - pattern-either:
      - pattern: $PATH.join(...,$SINK,...)
      - pattern: $PATH.resolve(...,$SINK,...)
  - patterns:
    - focus-metavariable: $SINK
    - pattern-inside: |
        import 'path';
        ...
    - pattern-either:
      - pattern-inside: path.join(...,$SINK,...)
      - pattern-inside: path.resolve(...,$SINK,...)
  pattern-sanitizers:
  - pattern: $Y.replace(...)
  - pattern: $Y.indexOf(...)
  - pattern: |
      function ... (...) {
          ...
          <... $Y.indexOf(...) ...>
          ...
      }
  - patterns:
    - pattern: $FUNC(...)
    - metavariable-regex:
        metavariable: $FUNC
        regex: sanitize
  # 2026-10-02 PAAW canonical guards（coding-security.mjs / semgrep-runner safePath）
  - pattern: safeResolve(...)
  - pattern: sanitizeId(...)
  - pattern: safePath(...)
  - pattern: assertSafeUrl(...)
